name: Docs

# Build the documentation on every pull request (to catch broken docs early),
# and publish it to GitHub Pages whenever main changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[docs]"
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment halfway through.
    concurrency:
      cancel-in-progress: false
      group: pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
